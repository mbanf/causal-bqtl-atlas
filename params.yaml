# ============================================================================
# Causal bQTL Atlas Pipeline — Input Parameters
# ============================================================================
#
# This file documents ALL input data required by the pipeline and provides
# configurable paths. Override any parameter on the command line:
#
#   nextflow run main.nf -params-file params.yaml
#   nextflow run main.nf --data_dir /path/to/custom/data
#
# For OneDrive/shared folder setup, ensure ALL files listed under
# "Required Input Files" are present in the data directory structure.
# ============================================================================

# ── Directories ──
data_dir: "${projectDir}/data"
results_dir: "${projectDir}/results"
figures_dir: "${projectDir}/figures"

# ── External dependencies (optional) ──
genotype_dir: null          # Path to Julia's NAM_genotypes_2FP_WW/ folder
                            # Only needed if re-running script 03 (CONVERT_GENOTYPES)
                            # If null, uses pre-converted data/processed/nam_founder_genotypes_at_bqtl.tsv

# ── Reference genome ──
genome_fasta: "${data_dir}/raw/B73_NAM5.fa"
gff3: "${data_dir}/raw/Zm-B73-REFERENCE-NAM-5.0_Zm00001eb.1.gff3"

# ── Motif database ──
pwm_database: "${data_dir}/processed/maize_tf_pwm_database.json"

# ── Analysis parameters ──
promoter_size: 2000         # bp upstream of TSS for promoter definition
fdr_threshold: 0.05         # FDR cutoff for significance
motif_score_threshold: 6.0  # PWM log-odds score threshold

# ── Pipeline options ──
skip_genotype_download: true


